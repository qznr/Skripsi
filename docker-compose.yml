services:
  web:
    build:
      context: .
    volumes:
      # In production, application code should be baked into the image, not mounted as a volume.
      # This ensures consistency and prevents accidental changes.
      # - ./app:/app # Remove for production
      # - ./data:/app/data # Data should be copied into the image if it's static, or handled via external storage.
      # - ./schema.sql:/app/schema.sql # Schema should be applied by the application on startup or via migrations.
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    networks:
      - bthesis_gustav
      - proxy
    depends_on:
      - db
      - tei-embedding
      - tei-reranker

  db:
    image: pgvector/pgvector:pg17-trixie
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - bthesis_gustav
    restart: always

  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7.4
    command:
      - --model-id
      - nomic-ai/nomic-embed-text-v1.5
      - --max-batch-tokens
      - "128"
      - --max-client-batch-size
      - "4"
      - --auto-truncate 
    volumes:
      - huggingface_cache:/data
    networks:
      - bthesis_gustav
      - tei_net
    restart: always # Add restart policy for production

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7.4
    command:
      - --model-id
      - cross-encoder/ms-marco-MiniLM-L2-v2
      - --max-batch-tokens
      - "2048"
      - --max-client-batch-size
      - "8"
      - --auto-truncate
    volumes:
      - huggingface_cache:/data
    networks:
      - bthesis_gustav
      - tei_net
    restart: always

volumes:
  postgres_data:
  huggingface_cache:

networks:
  bthesis_gustav:
  tei_net:
    name: tei_net
  proxy:
    external: true